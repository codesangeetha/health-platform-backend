openapi: 3.0.0
info:
  title: Health Management Platform API
  description: Comprehensive API documentation for the Health Management Platform connecting patients, doctors, and administrators
  version: 1.0.0
  contact:
    name: Health Platform API Team
    email: api@healthplatform.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.healthplatform.com/v1
    description: Production server
  - url: https://staging-api.healthplatform.com/v1
    description: Staging server
  - url: https://dev-api.healthplatform.com/v1
    description: Development server

security:
  - BearerAuth: []

paths:
  # Authentication Endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: User Registration
      description: Register a new user (Patient, Doctor, or Admin)
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              userType: "patient"
              email: "user@example.com"
              password: "SecurePassword123!"
              firstName: "John"
              lastName: "Doe"
              phone: "+1234567890"
              dateOfBirth: "1990-01-01"
              specialization: "Cardiology"
              licenseNumber: "MD123456"
              experience: "10"
              consultationFee: 100
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticate user and return JWT token
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "user@example.com"
              password: "SecurePassword123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Forgot Password
      description: Send password reset email
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: "user@example.com"
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset Password
      description: Reset user password with token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: "reset_token_123"
              newPassword: "NewSecurePassword123!"
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Patient Endpoints
  /patients/profile:
    get:
      tags:
        - Patients
      summary: Get Patient Profile
      description: Get current patient's profile information
      operationId: getPatientProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Patients
      summary: Update Patient Profile
      description: Update patient profile information
      operationId: updatePatientProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientProfileUpdateRequest'
            example:
              firstName: "John"
              lastName: "Doe"
              phone: "+1234567890"
              bloodGroup: "A+"
              allergies: ["Penicillin"]
              chronicDiseases: ["Diabetes"]
              emergencyContact:
                name: "Jane Doe"
                relationship: "Spouse"
                phone: "+1234567891"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfileUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Doctor Endpoints
  /doctors/profile:
    get:
      tags:
        - Doctors
      summary: Get Doctor Profile
      description: Get current doctor's profile information
      operationId: getDoctorProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Doctors
      summary: Update Doctor Profile
      description: Update doctor profile information
      operationId: updateDoctorProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorProfileUpdateRequest'
            example:
              consultationFee: 120
              availableDays: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
              availableTime:
                start: "08:00"
                end: "18:00"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorProfileUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Administrator Endpoints
  /admin/users:
    get:
      tags:
        - Administrators
      summary: Get All Users
      description: Get all users in the system (Admin only)
      operationId: getAllUsers
      security:
        - BearerAuth: []
      parameters:
        - name: userType
          in: query
          description: Filter by user type
          schema:
            type: string
            enum: [patient, doctor, admin]
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Administrators
      summary: Create User
      description: Create a new user (Admin only)
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              userType: "doctor"
              email: "doctor@example.com"
              password: "SecurePassword123!"
              firstName: "Michael"
              lastName: "Johnson"
              phone: "+1234567890"
              specialization: "Neurology"
              licenseNumber: "MD789012"
              experience: "15"
              consultationFee: 150
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{userId}/status:
    put:
      tags:
        - Administrators
      summary: Update User Status
      description: Update user status (Admin only)
      operationId: updateUserStatus
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example:
              status: "active"
      responses:
        '200':
          description: User status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Doctor Appointment System
  /appointments/doctors:
    get:
      tags:
        - Appointments
      summary: Get Available Doctors
      description: Get list of available doctors with filters
      operationId: getAvailableDoctors
      security:
        - BearerAuth: []
      parameters:
        - name: specialization
          in: query
          description: Filter by specialization
          schema:
            type: string
        - name: location
          in: query
          description: Filter by location
          schema:
            type: string
        - name: date
          in: query
          description: Filter by available date
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Doctors retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableDoctorsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /appointments/doctors/{doctorId}/availability:
    get:
      tags:
        - Appointments
      summary: Get Doctor Availability
      description: Get doctor's availability for specific date range
      operationId: getDoctorAvailability
      security:
        - BearerAuth: []
      parameters:
        - name: doctorId
          in: path
          required: true
          description: Doctor ID
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          description: Start date
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          description: End date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Availability retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAvailabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /appointments/book:
    post:
      tags:
        - Appointments
      summary: Book Appointment
      description: Book a new appointment
      operationId: bookAppointment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
            example:
              doctorId: "doctor_123"
              date: "2024-01-15"
              time: "09:00"
              appointmentType: "in-person"
              reason: "Regular checkup"
              symptoms: ["Chest pain", "Shortness of breath"]
      responses:
        '201':
          description: Appointment booked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookAppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /appointments/patient:
    get:
      tags:
        - Appointments
      summary: Get Patient Appointments
      description: Get current patient's appointments
      operationId: getPatientAppointments
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [upcoming, completed, cancelled]
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Appointments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientAppointmentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /appointments/doctor:
    get:
      tags:
        - Appointments
      summary: Get Doctor Appointments
      description: Get current doctor's appointments
      operationId: getDoctorAppointments
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          description: Filter by date
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [upcoming, completed, cancelled]
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Appointments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAppointmentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /appointments/{appointmentId}/reschedule:
    put:
      tags:
        - Appointments
      summary: Reschedule Appointment
      description: Reschedule an existing appointment
      operationId: rescheduleAppointment
      security:
        - BearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: Appointment ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleAppointmentRequest'
            example:
              newDate: "2024-01-16"
              newTime: "10:00"
              reason: "Personal emergency"
      responses:
        '200':
          description: Appointment rescheduled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleAppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /appointments/{appointmentId}/cancel:
    put:
      tags:
        - Appointments
      summary: Cancel Appointment
      description: Cancel an appointment
      operationId: cancelAppointment
      security:
        - BearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: Appointment ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequest'
            example:
              reason: "Not feeling well"
      responses:
        '200':
          description: Appointment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /appointments/{appointmentId}/status:
    put:
      tags:
        - Appointments
      summary: Update Appointment Status
      description: Update appointment status (Doctor/Admin only)
      operationId: updateAppointmentStatus
      security:
        - BearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: Appointment ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentStatusRequest'
            example:
              status: "completed"
              notes: "Patient arrived on time"
      responses:
        '200':
          description: Appointment status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAppointmentStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Pharmacy Module - Combined endpoints to avoid duplication
  /pharmacy/medicines/search:
    get:
      tags:
        - Pharmacy
      summary: Search Medicines
      description: Search for medicines by name or category
      operationId: searchMedicines
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          description: Search query
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Medicines retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicinesSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pharmacy/medicines:
    get:
      tags:
        - Pharmacy Admin
      summary: Get All Medicines
      description: Get all medicines in the pharmacy inventory (Admin only)
      operationId: getAllMedicines
      security:
        - BearerAuth: []
      parameters:
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [active, inactive]
        - name: lowStock
          in: query
          description: Filter by low stock
          schema:
            type: boolean
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Medicines retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllMedicinesResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Pharmacy Admin
      summary: Add New Medicine
      description: Add a new medicine to the pharmacy inventory (Admin only)
      operationId: addMedicine
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMedicineRequest'
            example:
              name: "Ibuprofen 400mg"
              genericName: "Ibuprofen"
              category: "Pain Relief"
              manufacturer: "MediCorp Pharmaceuticals"
              price: 8.99
              stock: 200
              prescriptionRequired: false
              description: "Nonsteroidal anti-inflammatory drug (NSAID) used for pain relief and reducing inflammation"
              dosage: "1 tablet every 6-8 hours with food"
              sideEffects: ["Stomach upset", "Headache", "Dizziness"]
              interactions: ["Aspirin", "Blood thinners", "Alcohol"]
              ingredients: ["Ibuprofen 400mg"]
              storage: "Store at room temperature away from moisture and heat"
              expiryDate: "2026-12-31"
              status: "active"
      responses:
        '201':
          description: Medicine added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddMedicineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pharmacy/medicines/{medicineId}:
    get:
      tags:
        - Pharmacy
      summary: Get Medicine Details
      description: Get detailed information about a specific medicine
      operationId: getMedicineDetails
      security:
        - BearerAuth: []
      parameters:
        - name: medicineId
          in: path
          required: true
          description: Medicine ID
          schema:
            type: string
      responses:
        '200':
          description: Medicine details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicineDetailsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Pharmacy Admin
      summary: Update Medicine Information
      description: Update medicine information (Admin only)
      operationId: updateMedicine
      security:
        - BearerAuth: []
      parameters:
        - name: medicineId
          in: path
          required: true
          description: Medicine ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMedicineRequest'
            example:
              name: "Ibuprofen 400mg"
              genericName: "Ibuprofen"
              category: "Pain Relief"
              manufacturer: "MediCorp Pharmaceuticals"
              price: 9.99
              description: "Nonsteroidal anti-inflammatory drug (NSAID) used for pain relief and reducing inflammation"
              dosage: "1 tablet every 6-8 hours with food"
              sideEffects: ["Stomach upset", "Headache", "Dizziness"]
              interactions: ["Aspirin", "Blood thinners", "Alcohol"]
              ingredients: ["Ibuprofen 400mg"]
              storage: "Store at room temperature away from moisture and heat"
              status: "active"
      responses:
        '200':
          description: Medicine updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMedicineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Pharmacy Admin
      summary: Delete Medicine
      description: Remove a medicine from the pharmacy inventory (Admin only)
      operationId: deleteMedicine
      security:
        - BearerAuth: []
      parameters:
        - name: medicineId
          in: path
          required: true
          description: Medicine ID
          schema:
            type: string
      responses:
        '200':
          description: Medicine deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMedicineResponse'
        '400':
          description: Cannot delete medicine with existing orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Cannot delete medicine with existing orders"
                error: "PHM_005"
                timestamp: "2024-01-10T14:00:00Z"
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pharmacy/medicines/{medicineId}/inventory:
    put:
